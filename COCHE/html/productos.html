<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos - COCHÉ</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/index_admin.css">
    <link rel="stylesheet" href="../css/productos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo-section">
                <img src="../img/logo.jpg" alt="Logo" class="logo-small" id="logoSidebar">
                <h3>COCHÉ CAFÉ</h3>
            </div>

            <nav class="menu">
                <p class="menu-label">Operaciones</p>
                <a href="../html/index_admin.html"><i class="fa-solid fa-house"></i> Inicio</a>
                <a href="../html/mesas.html"><i class="fa-solid fa-mug-hot"></i> Mesas</a>
                <a href="#" class="active"><i class="fa-solid fa-book-open"></i> Catalogo</a>

                <p class="menu-label">Administración</p>
                <a href="../html/inventario.html"><i class="fa-solid fa-boxes-stacked"></i> Inventario</a>
                <a href="../html/reportes.html"><i class="fa-solid fa-chart-pie"></i> Reportes Finanzas</a>
                <a href="../html/cierre de caja.html"><i class="fa-solid fa-cash-register"></i> Cierre de Caja</a>
                <a href="../html/usuarios.html"><i class="fa-solid fa-users"></i> Usuarios</a>
                <a href="../html/configuracion.html"><i class="fa-solid fa-gears"></i> Configuración</a>
            </nav>

            <div class="sidebar-footer">
                <a href="javascript:void(0)" class="btn-logout" onclick="confirmarCierreSesion()">
                    <i class="fa-solid fa-power-off"></i> Cerrar Sesión
                </a>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="welcome-text">
                    <h2>Catálogo de Productos (Menú)</h2>
                    <p>Gestión de precios y disponibilidad</p>
                </div>
            </header>

            <section class="inventario-container">
                <div class="controles-superiores">
    <div class="acciones-inventario">
        <button class="btn-agregar" onclick="abrirModalNuevoProducto()">
            <i class="fa-solid fa-plus"></i> Agregar Producto al Menú
        </button>
    </div>

    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="inputBusqueda" placeholder="Buscar producto..." onkeyup="filtrarProductos()">
    </div>
</div>

                <div class="tabla-wrapper">
                    <table class="tabla-coche">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Categoría</th>
                                <th>Precio Venta</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTablaProductos">
                            </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/obligatorios.js"></script>
    <script src="../js/productos.js"></script>
</body>
</html>
