<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Mesas - COCHÉ</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/index_admin.css">
    <link rel="stylesheet" href="../css/reportes.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo-section">
              <img src="../img/logo.jpg" alt="Logo" class="logo-small" id="logoSidebar">
              <h3>COCHÉ CAFÉ</h3>
            </div>

            <nav class="menu">
                <p class="menu-label">Operaciones</p>
                <a href="../html/index_usuarios.html"><i class="fa-solid fa-house"></i> Inicio</a>
                <a href="mesas_usuarios.html" class="active"><i class="fa-solid fa-mug-hot"></i> Mesas</a>
                <a href="../html/productos_usuarios.html"><i class="fa-solid fa-book-open"></i> Catalogo</a>
                
                <p class="menu-label">Administración</p>
                <a href="../html/inventario_usuarios.html"><i class="fa-solid fa-boxes-stacked"></i> Inventario</a>
                <a href="#" class="active"><i class="fa-solid fa-chart-pie"></i> Reportes Finanzas</a>
                <a href="../html/cierre de caja usua.html"><i class="fa-solid fa-cash-register"></i> Cierre de Caja</a>

            </nav>
            <div class="sidebar-footer">
              <a href="javascript:void(0)" class="btn-logout" onclick="confirmarCierreSesion()">
                 <i class="fa-solid fa-power-off"></i> Cerrar Sesión
              </a>
            </div>
        </aside>

        <div class="main-panel">
            <div class="header-bienvenida">
                <h2>Reportes y Control de Finanzas</h2>
                <div class="info-admin-container" style="background-color: #f8f9fa; border-left: 4px solid #4b2c20; padding: 10px 15px; border-radius: 5px;">
                    <p style="margin: 0; color: #4b2c20; font-size: 0.9em; font-weight: 500;">
                        <i class="fas fa-info-circle"></i> El saldo inicial es controlado únicamente por el Administrador.
                    </p>
                </div>
            </div>

            <div class="flex-content">
                <div class="section-container">
                    <h4><i class="fas fa-wallet"></i> Gestión de Efectivo</h4>
                    <form id="form-finanzas">
                        <input type="text" id="desc" placeholder="Descripción (ej. Compra leche)" class="input-coche">
                        <input type="number" id="monto" placeholder="Monto $" class="input-coche">
                        <select id="tipo" class="input-coche">
                            <option value="salida">Salida (Gasto Insumos) (-)</option>
                            <option value="propina">Registro de Propinas (No Ingreso) (+)</option>
                        </select>
                        <button type="button" class="btn-primario" onclick="confirmarRegistro()">Registrar Movimiento</button>
                    </form>
                </div>

                <div class="section-container">
                    <h4><i class="fas fa-list"></i> Flujo de Caja del Día</h4>
                    <div class="table-scroll">
                        <table class="tabla-coche">
                            <thead>
                                <tr>
                                    <th>Detalle</th>
                                    <th>Tipo</th>
                                    <th>Monto</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-movimientos">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/obligatorios.js"></script>
    <script src="../js/reportes.js"></script>
</body>
</html>
