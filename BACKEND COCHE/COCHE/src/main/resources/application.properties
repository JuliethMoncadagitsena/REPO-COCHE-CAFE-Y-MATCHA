# Nombre de la aplicación en el ecosistema de Spring Boot
spring.application.name=COCHE
# Dirección (URL) de la base de datos MySQL: indica el servidor (localhost), el puerto (3306) y el nombre exacto de la base de datos (bd_coche)
spring.datasource.url=jdbc:mysql://localhost:3306/bd_coche
# Nombre de usuario para acceder a MySQL (por defecto en XAMPP es "root")
spring.datasource.username=root
# Contraseña de MySQL (en XAMPP viene vacía por defecto)
spring.datasource.password=
# Driver oficial JDBC de Java necesario para comunicarse con el servidor de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Dialecto de Hibernate: especifica el lenguaje SQL exacto de MySQL que usará Spring para traducir las consultas de Java
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Muestra en la terminal las sentencias SQL reales que Spring/Hibernate ejecuta en la base de datos
spring.jpa.show-sql=true
# Mantiene actualizada y sincronizada la estructura de las tablas en MySQL según los cambios en tus Entidades Java
spring.jpa.hibernate.ddl-auto=update